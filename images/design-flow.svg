<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="step1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="step2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="step3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="step4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#e11d48"/></linearGradient>
    <linearGradient id="step5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="step6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="600" height="280" fill="#f8fafc" rx="16"/>

  <!-- 第一行：Step 1-3 -->
  <rect x="20" y="25" width="165" height="70" rx="10" fill="url(#step1)" filter="url(#s)"/>
  <text x="55" y="50" fill="#fff" font-size="12" font-weight="700" opacity="0.6">Step 1</text>
  <text x="55" y="70" fill="#fff" font-size="14" font-weight="700">确定负载尺寸</text>
  <text x="55" y="85" fill="#fff" font-size="10" opacity="0.85">重量·重心</text>
  <line x1="185" y1="60" x2="210" y2="60" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="218" y="25" width="165" height="70" rx="10" fill="url(#step2)" filter="url(#s)"/>
  <text x="253" y="50" fill="#fff" font-size="12" font-weight="700" opacity="0.6">Step 2</text>
  <text x="253" y="70" fill="#fff" font-size="14" font-weight="700">选择舵机</text>
  <text x="253" y="85" fill="#fff" font-size="10" opacity="0.85">扭矩余量 1.5~2 倍</text>
  <line x1="383" y1="60" x2="408" y2="60" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="415" y="25" width="165" height="70" rx="10" fill="url(#step3)" filter="url(#s)"/>
  <text x="460" y="50" fill="#fff" font-size="12" font-weight="700" opacity="0.6">Step 3</text>
  <text x="460" y="70" fill="#fff" font-size="14" font-weight="700">CAD 画图</text>
  <text x="460" y="85" fill="#fff" font-size="10" opacity="0.85">Fusion 360 / SolidWorks</text>

  <!-- 向下转弯 -->
  <path d="M498,95 L498,115 L300,115 L300,130" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- 第二行：Step 4-6 -->
  <rect x="20" y="135" width="165" height="70" rx="10" fill="url(#step4)" filter="url(#s)"/>
  <text x="55" y="160" fill="#fff" font-size="12" font-weight="700" opacity="0.6">Step 4</text>
  <text x="55" y="180" fill="#fff" font-size="14" font-weight="700">打印/切割</text>
  <text x="55" y="195" fill="#fff" font-size="10" opacity="0.85">试装 → 发现问题</text>
  <line x1="185" y1="170" x2="210" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="218" y="135" width="165" height="70" rx="10" fill="url(#step5)" filter="url(#s)"/>
  <text x="253" y="160" fill="#fff" font-size="12" font-weight="700" opacity="0.6">Step 5</text>
  <text x="253" y="180" fill="#fff" font-size="14" font-weight="700">修改设计</text>
  <text x="253" y="195" fill="#fff" font-size="10" opacity="0.85">再次打印验证</text>
  <line x1="383" y1="170" x2="408" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="415" y="135" width="165" height="70" rx="10" fill="url(#step6)" filter="url(#s)"/>
  <text x="460" y="160" fill="#fff" font-size="12" font-weight="700" opacity="0.6">Step 6</text>
  <text x="460" y="180" fill="#fff" font-size="14" font-weight="700">电控调试</text>
  <text x="460" y="195" fill="#fff" font-size="10" opacity="0.85">角度映射 + PID 平滑</text>

  <!-- 循环箭头：Step 4 ↔ Step 5 -->
  <path d="M498,170 Q 530,170 530,100 Q 530,30 498,30" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <text x="548" y="100" text-anchor="middle" font-size="10" fill="#94a3b8" transform="rotate(90, 548, 100)">迭代优化</text>
</svg>
