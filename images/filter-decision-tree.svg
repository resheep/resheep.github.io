<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.1"/></filter>
    <marker id="dn" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L5,10 L10,0Z" fill="#64748b"/></marker>
  </defs>

  <rect width="580" height="320" fill="#f8fafc" rx="14"/>

  <!-- ========= 上半：选型决策树 ========= -->
  <text x="290" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">滤波算法选型决策树</text>

  <!-- 根 -->
  <rect x="195" y="36" width="190" height="28" rx="8" fill="url(#g1)" filter="url(#s)"/>
  <text x="290" y="55" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">传感器读数有噪声？</text>

  <!-- 分叉线 -->
  <line x1="290" y1="64" x2="290" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="100" y1="80" x2="480" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="100" y1="80" x2="100" y2="95" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dn)"/>
  <line x1="290" y1="80" x2="290" y2="95" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dn)"/>
  <line x1="480" y1="80" x2="480" y2="95" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dn)"/>

  <!-- 分支 1：偶尔跳变 -->
  <rect x="20" y="100" width="160" height="44" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="117" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">偶尔跳变</text>
  <text x="100" y="133" text-anchor="middle" font-size="9" fill="#64748b">超声波 / 红外</text>
  <line x1="100" y1="144" x2="100" y2="158" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dn)"/>
  <rect x="30" y="163" width="140" height="30" rx="8" fill="url(#g4)" filter="url(#s)"/>
  <text x="100" y="183" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">中值滤波</text>

  <!-- 分支 2：白噪声 -->
  <rect x="210" y="100" width="160" height="44" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="290" y="117" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">白噪声</text>
  <text x="290" y="133" text-anchor="middle" font-size="9" fill="#64748b">ADC / 温度</text>
  <line x1="290" y1="144" x2="290" y2="158" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dn)"/>
  <rect x="220" y="163" width="140" height="30" rx="8" fill="url(#g2)" filter="url(#s)"/>
  <text x="290" y="183" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">滑动平均 / 一阶低通</text>

  <!-- 分支 3：多传感器融合 -->
  <rect x="400" y="100" width="160" height="44" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="117" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">多传感器融合</text>
  <text x="480" y="133" text-anchor="middle" font-size="9" fill="#64748b">IMU / 姿态</text>
  <line x1="480" y1="144" x2="480" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="415" y1="150" x2="545" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="415" y1="150" x2="415" y2="163" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dn)"/>
  <line x1="545" y1="150" x2="545" y2="163" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dn)"/>

  <rect x="375" y="168" width="80" height="28" rx="6" fill="url(#g3)" filter="url(#s)"/>
  <text x="415" y="186" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">算力有限</text>

  <rect x="505" y="168" width="80" height="28" rx="6" fill="url(#g1)" filter="url(#s)"/>
  <text x="545" y="186" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">算力充足</text>

  <line x1="415" y1="196" x2="415" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dn)"/>
  <line x1="545" y1="196" x2="545" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dn)"/>

  <rect x="377" y="215" width="76" height="24" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="415" y="232" text-anchor="middle" font-size="11" fill="#059669" font-weight="600">互补滤波</text>

  <rect x="505" y="215" width="76" height="24" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="543" y="232" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">卡尔曼滤波</text>

  <!-- ========= 下半：MPU6050 数据链 ========= -->
  <rect x="20" y="252" width="540" height="58" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="290" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">MPU6050 数据处理链</text>
  <!-- 流程块 -->
  <rect x="35" y="278" width="90" height="22" rx="4" fill="#f1f5f9"/>
  <text x="80" y="293" text-anchor="middle" font-size="9" fill="#475569">MPU6050 原始数据</text>
  <line x1="125" y1="289" x2="140" y2="289" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="145" y="278" width="90" height="22" rx="4" fill="#f1f5f9"/>
  <text x="190" y="293" text-anchor="middle" font-size="9" fill="#475569">低通滤波（硬件）</text>
  <line x1="235" y1="289" x2="250" y2="289" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="255" y="278" width="90" height="22" rx="4" fill="#f1f5f9"/>
  <text x="300" y="293" text-anchor="middle" font-size="9" fill="#475569">滑动平均去抖</text>
  <line x1="345" y1="289" x2="360" y2="289" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="365" y="278" width="90" height="22" rx="4" fill="#f1f5f9"/>
  <text x="410" y="293" text-anchor="middle" font-size="9" fill="#475569">互补滤波融合</text>
  <line x1="455" y1="289" x2="470" y2="289" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="475" y="278" width="70" height="22" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="510" y="293" text-anchor="middle" font-size="9" fill="#059669" font-weight="600">输出角度</text>

  <defs><marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#94a3b8"/></marker></defs>
</svg>
