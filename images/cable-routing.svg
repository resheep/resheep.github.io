<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="cableRed" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/></linearGradient>
    <linearGradient id="cableBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
  </defs>
  <rect width="480" height="180" fill="#f8fafc" rx="12"/>

  <!-- 左侧：正确走线 -->
  <rect x="12" y="12" width="222" height="156" rx="10" fill="#fff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="123" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#10b981">✅ 正确走线</text>

  <!-- 舵机方块 -->
  <rect x="45" y="50" width="50" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="70" y="74" text-anchor="middle" font-size="10" fill="#475569">舵机</text>
  <rect x="130" y="50" width="50" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="155" y="74" text-anchor="middle" font-size="10" fill="#475569">舵机</text>

  <!-- 线缆从侧面绕出，带弧度 -->
  <path d="M 95 60 Q 115 45 130 60" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 95 75 Q 115 90 130 75" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <circle cx="100" cy="110" r="10" fill="#3b82f6" opacity="0.15"/>
  <circle cx="100" cy="110" r="4" fill="#3b82f6" opacity="0.4"/>
  <text x="100" y="138" text-anchor="middle" font-size="10" fill="#64748b">线缆预留弧度</text>
  <text x="100" y="152" text-anchor="middle" font-size="10" fill="#64748b">从侧面绕出</text>

  <!-- 右侧：错误走线 -->
  <rect x="246" y="12" width="222" height="156" rx="10" fill="#fff" stroke="#fecaca" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="357" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#ef4444">❌ 错误走线</text>

  <rect x="280" y="50" width="50" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="305" y="74" text-anchor="middle" font-size="10" fill="#475569">舵机</text>
  <rect x="360" y="50" width="50" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="385" y="74" text-anchor="middle" font-size="10" fill="#475569">舵机</text>

  <!-- 线缆缠在中间，绞在一起 -->
  <path d="M 330 55 Q 340 70 330 85 Q 320 100 330 105" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 330 80 Q 340 95 330 110" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

  <text x="357" y="115" text-anchor="middle" font-size="10" fill="#64748b">线缆在轴心穿过</text>
  <text x="357" y="130" text-anchor="middle" font-size="10" fill="#ef4444" font-weight="600">容易绞断！</text>
</svg>
