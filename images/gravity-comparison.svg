<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#e11d48"/></linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
  </defs>
  <rect width="480" height="220" fill="#f8fafc" rx="12"/>

  <!-- 左侧：重心偏离 -->
  <rect x="15" y="15" width="220" height="190" rx="10" fill="#fff" filter="url(#shadow)" stroke="#fecaca" stroke-width="1.5"/>
  <rect x="60" y="30" width="130" height="16" rx="4" fill="#e2e8f0"/>
  <circle cx="125" cy="46" r="6" fill="#f43f5e" opacity="0.6"/>
  <line x1="125" y1="52" x2="125" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <!-- tilt indicator -->
  <rect x="110" y="85" width="30" height="30" rx="4" fill="#f43f5e" opacity="0.2"/>
  <line x1="125" y1="100" x2="125" y2="130" stroke="#f43f5e" stroke-width="2.5"/>
  <circle cx="125" cy="138" r="18" fill="url(#redGrad)" opacity="0.8"/>
  <text x="125" y="143" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">舵机</text>
  <!-- offset arrow -->
  <line x1="125" y1="85" x2="100" y2="100" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="60" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#f43f5e">❌ 重心偏离</text>
  <text x="60" y="192" text-anchor="middle" font-size="10" fill="#64748b">舵机吃力，易丢步</text>

  <!-- 右侧：重心对齐 -->
  <rect x="245" y="15" width="220" height="190" rx="10" fill="#fff" filter="url(#shadow)" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="290" y="30" width="130" height="16" rx="4" fill="#e2e8f0"/>
  <circle cx="355" cy="46" r="6" fill="#10b981" opacity="0.6"/>
  <line x1="355" y1="52" x2="355" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <!-- centered -->
  <rect x="340" y="85" width="30" height="30" rx="4" fill="#10b981" opacity="0.2"/>
  <line x1="355" y1="100" x2="355" y2="130" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="355" cy="138" r="18" fill="url(#greenGrad)" opacity="0.8"/>
  <text x="355" y="143" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">舵机</text>
  <!-- check -->
  <text x="290" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#10b981">✅ 重心对齐</text>
  <text x="290" y="192" text-anchor="middle" font-size="10" fill="#64748b">舵机只需克服摩擦力</text>
</svg>
