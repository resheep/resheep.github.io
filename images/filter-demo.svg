<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="560" height="180" fill="#f8fafc" rx="12"/>

  <!-- 图例 -->
  <rect x="20" y="12" width="14" height="4" rx="2" fill="#ef4444" opacity="0.7"/>
  <text x="38" y="17" font-size="10" fill="#ef4444" font-weight="600">原始信号（含噪声）</text>
  <rect x="180" y="12" width="14" height="4" rx="2" fill="#10b981"/>
  <text x="198" y="17" font-size="10" fill="#10b981" font-weight="600">滤波后</text>

  <!-- 网格 -->
  <line x1="40" y1="40" x2="540" y2="40" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="40" y1="70" x2="540" y2="70" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="40" y1="100" x2="540" y2="100" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="40" y1="130" x2="540" y2="130" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="40" y1="160" x2="540" y2="160" stroke="#f1f5f9" stroke-width="1"/>

  <!-- 原始信号（噪声） -->
  <polyline points="
    40,108 48,92 56,120 64,84 72,112 80,96 88,124 96,88
    104,116 112,80 120,128 128,72 136,118 144,86 152,110
    160,94 168,122 176,78 184,114 192,82 200,126 208,90
    216,106 224,70 232,112 240,88 248,120 256,76 264,124
    272,92 280,108 288,74 296,116 304,84 312,122 320,90
    328,106 336,80 344,118 352,86 360,110 368,94 376,128
    384,72 392,112 400,88 408,124 416,78 424,114 432,82
    440,120 448,92 456,108 464,76 472,116 480,84 488,126
    496,90 504,110 512,86 520,118 528,80 536,122 540,100
  " fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>

  <!-- 滤波后信号（平滑） -->
  <polyline points="
    40,104 48,100 56,96 64,93 72,91 80,90 88,90 96,92
    104,94 112,97 120,100 128,102 136,104 144,104 152,103
    160,101 168,98 176,95 184,93 192,91 200,91 208,92
    216,94 224,97 232,100 240,102 248,104 256,104 264,103
    272,101 280,98 288,96 296,94 304,93 312,93 320,94
    328,96 336,99 344,101 352,103 360,104 368,103 376,102
    384,99 392,97 400,95 408,93 416,93 424,94 432,96
    440,99 448,101 456,103 464,103 472,102 480,100 488,97
    496,95 504,93 512,93 520,94 528,96 536,99 540,101
  " fill="none" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 标注箭头 -->
  <path d="M60,148 L60,168 Q60,175 65,175 L480,175 Q485,175 485,168 L485,148" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ar)"/>
  <path d="M250,178 L250,162" stroke="#94a3b8" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="265" y="173" font-size="10" fill="#64748b">滤波消除噪声，保留信号趋势</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
