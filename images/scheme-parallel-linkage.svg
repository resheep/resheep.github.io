<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="camGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </linearGradient>
    <linearGradient id="linkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="servoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="480" height="620" fill="#f8fafc" rx="16"/>

  <!-- 标题 -->
  <text x="240" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">方案二：平行连杆式结构</text>

  <!-- 负载平台 -->
  <rect x="140" y="70" width="200" height="80" rx="10" fill="url(#camGrad)" stroke="#94a3b8" stroke-width="2"/>
  <rect x="185" y="85" width="110" height="50" rx="6" fill="#1e293b"/>
  <circle cx="250" cy="110" r="14" fill="#3b82f6" opacity="0.8"/>
  <circle cx="250" cy="110" r="6" fill="#fff" opacity="0.9"/>
  <text x="240" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">负载平台（摄像头）</text>

  <!-- 负载上的铰接点 -->
  <circle cx="185" cy="130" r="5" fill="#7c3aed"/>
  <circle cx="295" cy="130" r="5" fill="#7c3aed"/>

  <!-- 平行连杆 (左) -->
  <line x1="185" y1="130" x2="155" y2="340" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <line x1="295" y1="130" x2="325" y2="340" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>

  <!-- 连杆上标注 "平行连杆" -->
  <text x="125" y="240" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="600" transform="rotate(-22, 125, 240)">平行连杆</text>
  <text x="355" y="240" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="600" transform="rotate(22, 355, 240)">平行连杆</text>

  <!-- 平行四边形标注虚线 -->
  <line x1="185" y1="130" x2="295" y2="130" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="155" y1="340" x2="325" y2="340" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="185" y1="130" x2="155" y2="340" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.3"/>
  <line x1="295" y1="130" x2="325" y2="340" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.3"/>

  <!-- "平行四边形机构" 标注 -->
  <text x="240" y="190" text-anchor="middle" font-size="11" fill="#7c3aed" opacity="0.8">┌ 平行四边形机构 ┐</text>
  <text x="240" y="204" text-anchor="middle" font-size="11" fill="#7c3aed" opacity="0.8">负载始终保持水平</text>

  <!-- 双舵机底座 -->
  <rect x="90" y="340" width="300" height="120" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 舵机 A (左) -->
  <rect x="110" y="360" width="100" height="55" rx="8" fill="url(#servoGrad)" stroke="#c2410c" stroke-width="2"/>
  <circle cx="160" cy="387" r="14" fill="#fff" opacity="0.25"/>
  <rect x="153" y="378" width="14" height="18" rx="3" fill="#fff" opacity="0.4"/>
  <text x="160" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#ea580c">舵机 A</text>
  <text x="160" y="452" text-anchor="middle" font-size="11" fill="#ea580c">(Pitch)</text>

  <!-- 舵机 A 舵臂和连杆连接 -->
  <line x1="160" y1="360" x2="160" y2="340" stroke="#c2410c" stroke-width="3"/>
  <circle cx="160" cy="340" r="4" fill="#c2410c"/>
  <!-- 舵机 A 到左连杆的连接 -->
  <line x1="160" y1="340" x2="155" y2="340" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>

  <!-- 舵机 B (右) -->
  <rect x="270" y="360" width="100" height="55" rx="8" fill="url(#servoGrad)" stroke="#c2410c" stroke-width="2"/>
  <circle cx="320" cy="387" r="14" fill="#fff" opacity="0.25"/>
  <rect x="313" y="378" width="14" height="18" rx="3" fill="#fff" opacity="0.4"/>
  <text x="320" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#ea580c">舵机 B</text>
  <text x="320" y="452" text-anchor="middle" font-size="11" fill="#ea580c">(Pitch)</text>

  <!-- 舵机 B 舵臂 -->
  <line x1="320" y1="360" x2="320" y2="340" stroke="#c2410c" stroke-width="3"/>
  <circle cx="320" cy="340" r="4" fill="#c2410c"/>
  <line x1="320" y1="340" x2="325" y2="340" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>

  <!-- 底座 -->
  <rect x="120" y="480" width="240" height="40" rx="8" fill="url(#baseGrad)" stroke="#334155" stroke-width="2"/>
  <text x="240" y="505" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">底座</text>

  <!-- 舵机运动箭头 (同步) -->
  <path d="M 140 395 A 20 20 0 0 1 180 395" fill="none" stroke="#ea580c" stroke-width="2"/>
  <path d="M 180 395 L 172 390 M 180 395 L 172 400" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <path d="M 300 395 A 20 20 0 0 0 340 395" fill="none" stroke="#ea580c" stroke-width="2"/>
  <path d="M 300 395 L 308 390 M 300 395 L 308 400" fill="none" stroke="#ea580c" stroke-width="2.5"/>

  <text x="240" y="395" text-anchor="middle" font-size="11" fill="#ea580c" font-weight="600">← 同步转动 →</text>

  <!-- 图例 -->
  <rect x="30" y="555" width="14" height="14" rx="3" fill="url(#servoGrad)"/>
  <text x="50" y="567" font-size="12" fill="#475569">舵机</text>
  <line x1="120" y1="562" x2="140" y2="562" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
  <text x="146" y="567" font-size="12" fill="#475569">平行连杆</text>
  <line x1="230" y1="562" x2="250" y2="562" stroke="#cbd5e1" stroke-width="2"/>
  <text x="256" y="567" font-size="12" fill="#475569">底座壳体</text>
</svg>
