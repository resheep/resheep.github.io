<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="560" height="170" fill="#f8fafc" rx="12"/>
  <text x="280" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">卡尔曼滤波核心方程</text>

  <!-- 预测阶段 -->
  <rect x="25" y="42" width="240" height="50" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="25" y="42" width="240" height="20" rx="8" fill="#f1f5f9"/>
  <text x="145" y="56" text-anchor="middle" font-size="10" font-weight="700" fill="#6366f1">预测（先验）</text>
  <text x="40" y="76" font-size="13" fill="#475569">x̂ₖ = A · x̂ₖ₋₁ + B · uₖ</text>
  <text x="40" y="88" font-size="13" fill="#475569">Pₖ = A · Pₖ₋₁ · Aᵀ + Q</text>

  <!-- 箭头 -->
  <path d="M265,67 L290,67" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- 更新阶段 -->
  <rect x="295" y="42" width="240" height="72" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="295" y="42" width="240" height="20" rx="8" fill="#f1f5f9"/>
  <text x="415" y="56" text-anchor="middle" font-size="10" font-weight="700" fill="#10b981">更新（后验）</text>
  <text x="310" y="74" font-size="12" fill="#475569">Kₖ = Pₖ · Hᵀ · (H · Pₖ · Hᵀ + R)⁻¹</text>
  <text x="310" y="88" font-size="12" fill="#475569">x̂ₖ = x̂ₖ + Kₖ · (zₖ − H · x̂ₖ)</text>
  <text x="310" y="102" font-size="12" fill="#475569">Pₖ = (I − Kₖ · H) · Pₖ</text>

  <!-- 图例 -->
  <rect x="25" y="125" width="500" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="50" cy="141" r="3" fill="#6366f1"/>
  <text x="58" y="145" font-size="10" fill="#64748b">x̂ 状态估计</text>
  <circle cx="140" cy="141" r="3" fill="#06b6d4"/>
  <text x="148" y="145" font-size="10" fill="#64748b">P 误差协方差</text>
  <circle cx="240" cy="141" r="3" fill="#f97316"/>
  <text x="248" y="145" font-size="10" fill="#64748b">K 卡尔曼增益</text>
  <circle cx="340" cy="141" r="3" fill="#ef4444"/>
  <text x="348" y="145" font-size="10" fill="#64748b">Q 过程噪声</text>
  <circle cx="440" cy="141" r="3" fill="#10b981"/>
  <text x="448" y="145" font-size="10" fill="#64748b">R 测量噪声</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#64748b"/></marker>
  </defs>
</svg>
